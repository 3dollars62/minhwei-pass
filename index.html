<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>敏惠醫專｜數位上課證與線上劃位</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
    body { margin: 0; background: #f1f5f9; color: #0f172a; padding: 14px; }
    .container { max-width: 480px; margin: 0 auto; }

    /* 登入卡片 */
    .login-card { background: #fff; border-radius: 20px; padding: 24px 20px; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08); margin-top: 24px; }
    .brand-tag { display: inline-block; background: #e0f2fe; color: #0369a1; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 99px; margin-bottom: 8px; }
    .login-card h1 { margin: 0 0 6px; font-size: 21px; color: #0f172a; }
    .login-card p { margin: 0 0 18px; font-size: 13.5px; color: #64748b; line-height: 1.5; }
    label { display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 5px; }
    input[type="tel"], input[type="text"] { width: 100%; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 12px; font-size: 16px; margin-bottom: 14px; outline: none; background: #fff; }
    input:focus { border-color: #0284c7; }
    .btn-primary { width: 100%; padding: 13px; border: none; border-radius: 12px; background: #0284c7; color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
    .err-msg { background: #fee2e2; color: #991b1b; padding: 10px 12px; border-radius: 10px; font-size: 13.5px; font-weight: 700; margin-top: 12px; text-align: center; }

    /* 上課證主卡片 */
    .pass-card { background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08); margin-bottom: 14px; }
    .pass-header { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); color: #fff; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; }
    .pass-header .title { font-size: 15px; font-weight: 900; letter-spacing: 0.5px; }
    .pass-header .sub { font-size: 11.5px; opacity: 0.8; margin-top: 2px; }
    .btn-refresh-top { background: rgba(255,255,255,0.16); color: #fff; border: 1px solid rgba(255,255,255,0.28); border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }

    .pass-body { padding: 18px; }
    .profile-row { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
    .avatar { width: 72px; height: 86px; border-radius: 14px; object-fit: cover; background: #e2e8f0; border: 1.5px solid #cbd5e1; flex-shrink: 0; }
    .stu-name-line { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
    .stu-name { font-size: 21px; font-weight: 900; color: #0f172a; }
    .seat-tag { background: #dbeafe; color: #1e40af; font-size: 12.5px; font-weight: 900; padding: 3px 9px; border-radius: 8px; border: 1px solid #93c5fd; }
    .btn-seat-text { background: transparent; border: none; color: #0284c7; font-size: 12.5px; font-weight: 800; text-decoration: underline; padding: 2px 4px; cursor: pointer; }
    .stu-meta { font-size: 13px; color: #475569; line-height: 1.5; }
    .seat-ended-note { font-size: 12.5px; color: #64748b; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 7px 10px; margin-top: 8px; font-weight: 600; }

    /* 雙證切換（校內班 / 二技班） */
    .pass-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #f1f5f9; padding: 4px; border-radius: 10px; margin-bottom: 12px; }
    .ps-btn { border: none; background: transparent; padding: 7px; border-radius: 8px; font-size: 13px; font-weight: 800; color: #475569; cursor: pointer; }
    .ps-btn.active { background: #fff; color: #0284c7; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

    /* QR Code 區 */
    .qr-box { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 16px; padding: 16px; text-align: center; }
    #qrcode { display: inline-block; padding: 10px; background: #fff; border-radius: 12px; border: 1px solid #cbd5e1; }
    #qrcode img, #qrcode canvas { display: block; margin: 0 auto; }
    .qr-id-text { font-size: 17px; font-weight: 900; letter-spacing: 1px; color: #0f172a; margin-top: 10px; }
    .qr-hint { font-size: 12px; color: #64748b; margin-top: 3px; }

    /* 線上劃位狀態區塊（依開關狀態動態變化） */
    .seat-action-area { margin-top: 14px; }
    .btn-seat-open { width: 100%; padding: 13px 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); color: #fff; font-size: 15px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25); }
    .btn-seat-locked { width: 100%; padding: 12px 14px; border: 1.5px solid #93c5fd; border-radius: 12px; background: #eff6ff; color: #1e40af; font-size: 14.5px; font-weight: 800; cursor: pointer; }
    .wait-card { background: #fffbeb; border: 1.5px solid #fcd34d; border-radius: 14px; padding: 12px 14px; text-align: center; }
    .wait-rank { font-size: 14px; font-weight: 900; color: #92400e; margin-bottom: 4px; }
    .wait-time { font-size: 13px; font-weight: 700; color: #b45309; }
    .wait-countdown { display: inline-block; background: #fef3c7; color: #78350f; font-size: 13.5px; font-weight: 900; padding: 4px 12px; border-radius: 99px; margin: 7px 0 9px; border: 1px solid #f59e0b; }
    .btn-preview-map { width: 100%; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; color: #334155; font-size: 13px; font-weight: 800; cursor: pointer; }
    .paused-card { background: #f8fafc; border: 1.5px dashed #cbd5e1; border-radius: 12px; padding: 11px 12px; text-align: center; font-size: 13px; color: #475569; font-weight: 700; }

    /* 出缺勤與講義卡片 */
    .sec-card { background: #fff; border-radius: 18px; padding: 16px 18px; box-shadow: 0 6px 18px rgba(15, 23, 42, 0.05); margin-bottom: 14px; }
    .sec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .sec-head h3 { margin: 0; font-size: 15.5px; font-weight: 900; color: #0f172a; }
    .full-pill { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 99px; }
    .full-pill.yes { background: #dcfce7; color: #166534; }
    .full-pill.no { background: #f1f5f9; color: #475569; }
    .att-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center; }
    .att-cell { background: #f8fafc; border-radius: 10px; padding: 8px 2px; border: 1px solid #e2e8f0; }
    .att-num { font-size: 17px; font-weight: 900; }
    .att-lbl { font-size: 11px; color: #64748b; font-weight: 700; margin-top: 2px; }
    .rec-toggle { width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 9px; padding: 7px; font-size: 12.5px; font-weight: 700; color: #475569; margin-top: 10px; cursor: pointer; }
    .rec-list { margin-top: 8px; max-height: 180px; overflow-y: auto; font-size: 12.5px; }
    .rec-row { display: flex; justify-content: space-between; padding: 6px 4px; border-bottom: 1px solid #f1f5f9; }

    .book-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #f1f5f9; font-size: 13.5px; gap: 8px; }
    .book-item:last-child { border-bottom: none; }
    .b-badge { font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 99px; flex-shrink: 0; }
    .b-badge.got { background: #dcfce7; color: #166534; }
    .b-badge.wait { background: #f1f5f9; color: #64748b; }

    .footer-logout { text-align: center; margin: 16px 0 24px; }
    .btn-logout { background: transparent; border: none; color: #64748b; font-size: 13px; text-decoration: underline; cursor: pointer; }

    /* === 教室座位表彈窗 === */
    .modal-mask { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); z-index: 999; display: none; align-items: center; justify-content: center; padding: 10px; }
    .modal-box { background: #fff; width: 100%; max-width: 720px; max-height: 92vh; overflow-y: auto; border-radius: 20px; padding: 16px; box-shadow: 0 20px 45px rgba(0,0,0,0.3); }
    .modal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .modal-top h3 { margin: 0; font-size: 17px; font-weight: 900; }
    .btn-close { width: 32px; height: 32px; border-radius: 50%; border: none; background: #e2e8f0; color: #334155; font-size: 16px; font-weight: 800; cursor: pointer; }
    .modal-banner { font-size: 13px; font-weight: 800; padding: 8px 12px; border-radius: 10px; margin-bottom: 10px; text-align: center; line-height: 1.4; }
    .modal-banner.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .modal-banner.warn { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .modal-banner.ok { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }

    .legend { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 8px; }
    .leg-dot { display: inline-block; width: 13px; height: 13px; border-radius: 4px; vertical-align: middle; margin-right: 4px; border: 1px solid #94a3b8; }

    .map-scroll { overflow-x: auto; background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 10px; -webkit-overflow-scrolling: touch; }
    .classroom { width: max-content; min-width: 100%; margin: 0 auto; }
    .wb { width: 100%; background: #334155; color: #fff; text-align: center; padding: 6px; border-radius: 7px; font-weight: 800; font-size: 13px; letter-spacing: 5px; margin-bottom: 10px; }
    .zones { display: flex; gap: 10px; justify-content: flex-start; }
    .zone { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 5px; flex-shrink: 0; }
    .sgrid { display: grid; gap: 3px; }
    .scell { height: 36px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 800; user-select: none; }
    .scell.head { height: 20px; background: #e2e8f0; color: #475569; font-size: 10px; }
    .scell.aisle { background: transparent; }
    .scell.res { background: #e2e8f0; color: #94a3b8; border: 1px dashed #cbd5e1; font-size: 9.5px; }
    .scell.free { background: #ffffff; border: 1.5px solid #94a3b8; color: #0f172a; cursor: pointer; }
    .scell.free.readonly { cursor: default; }
    .scell.taken { background: #cbd5e1; border: 1px solid #94a3b8; color: #64748b; cursor: not-allowed; }
    .scell.mine { background: #16a34a; border: 2px solid #14532d; color: #fff; }
    .scell.picked { background: #0284c7; border: 2px solid #0369a1; color: #fff; transform: scale(1.06); box-shadow: 0 2px 8px rgba(2,132,199,0.4); }
    .doors { display: flex; justify-content: space-between; width: 100%; margin-top: 8px; font-size: 11px; font-weight: 800; color: #475569; }
    .doors span { background: #e2e8f0; padding: 3px 10px; border-radius: 6px; }

    .confirm-bar { margin-top: 12px; background: #f0f9ff; border: 1.5px solid #7dd3fc; border-radius: 12px; padding: 12px; display: none; text-align: center; }
    .confirm-bar .picked-txt { font-size: 15px; font-weight: 900; color: #0369a1; margin-bottom: 8px; }
    .btn-confirm-seat { width: 100%; padding: 12px; border: none; border-radius: 10px; background: #0284c7; color: #fff; font-size: 15px; font-weight: 900; cursor: pointer; }
    .btn-confirm-seat:disabled { background: #94a3b8; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 登入畫面 -->
    <div id="loginView" class="login-card">
      <span class="brand-tag">敏惠醫護管理專科學校｜校內班</span>
      <h1>數位上課證系統</h1>
      <p>請輸入報名時填寫的手機號碼與身分證末四碼，即可開啟專屬上課證、查看全勤紀錄與進行線上劃位。</p>
      <label for="inpPhone">手機號碼</label>
      <input type="tel" id="inpPhone" placeholder="例如：0912345678" maxlength="12" onkeydown="if(event.key==='Enter') doLogin()">
      <label for="inpLast4">身分證末四碼</label>
      <input type="text" id="inpLast4" placeholder="請輸入 4 碼數字" maxlength="4" onkeydown="if(event.key==='Enter') doLogin()">
      <button id="btnLogin" class="btn-primary" onclick="doLogin()">開啟我的數位上課證</button>
      <div id="loginErr" class="err-msg" style="display:none;"></div>
    </div>

    <!-- 上課證主畫面 -->
    <div id="passView" style="display:none;">
      <div class="pass-card">
        <div class="pass-header">
          <div>
            <div class="title">敏惠校內班｜數位上課證</div>
            <div class="sub" id="hdrSubText">點名與領取講義專用條碼</div>
          </div>
          <button type="button" class="btn-refresh-top" onclick="refreshStudentData()">↻ 重新整理</button>
        </div>

        <div class="pass-body">
          <div class="profile-row">
            <img id="stuAvatar" class="avatar" referrerpolicy="no-referrer" src="">
            <div style="flex:1;min-width:0;">
              <div class="stu-name-line">
                <span class="stu-name" id="stuName">--</span>
                <span class="seat-tag" id="stuSeatBadge" style="display:none;">座位 --</span>
                <button type="button" class="btn-seat-text" id="btnSeatTextEnded" style="display:none;" onclick="openSeatModal()">查看座位圖</button>
              </div>
              <div class="stu-meta" id="stuMeta">--</div>
              <div class="seat-ended-note" id="seatEndedNoSeatNote" style="display:none;">線上劃位已截止，請洽行政老師安排座位</div>
            </div>
          </div>

          <!-- 若同時有報二技衝刺班，顯示切換列 -->
          <div id="erjiSwitchBar" class="pass-switch" style="display:none;">
            <button type="button" id="psMain" class="ps-btn active" onclick="switchPassCard('main')">敏惠校內班</button>
            <button type="button" id="psErji" class="ps-btn" onclick="switchPassCard('erji')">二技衝刺班</button>
          </div>

          <div class="qr-box">
            <div id="qrcode"></div>
            <div class="qr-id-text" id="qrIdLabel">--</div>
            <div class="qr-hint" id="qrHintLabel">進教室點名或領取講義時，請出示此條碼</div>
          </div>

          <!-- 線上劃位互動區塊（依據後台三階段開關自動切換） -->
          <div id="seatActionArea" class="seat-action-area" style="display:none;"></div>
        </div>
      </div>

      <!-- 出缺勤與全勤統計 -->
      <div id="attCard" class="sec-card" style="display:none;">
        <div class="sec-head">
          <h3>出缺勤與全勤統計</h3>
          <span id="fullAttBadge" class="full-pill no">計算中</span>
        </div>
        <div class="att-grid">
          <div class="att-cell"><div class="att-num" style="color:#16a34a;" id="cntPresent">0</div><div class="att-lbl">出席</div></div>
          <div class="att-cell"><div class="att-num" style="color:#ea580c;" id="cntLate">0</div><div class="att-lbl">遲到</div></div>
          <div class="att-cell"><div class="att-num" style="color:#9333ea;" id="cntEarly">0</div><div class="att-lbl">早退</div></div>
          <div class="att-cell"><div class="att-num" style="color:#2563eb;" id="cntLeave">0</div><div class="att-lbl">請假</div></div>
          <div class="att-cell"><div class="att-num" style="color:#dc2626;" id="cntAbsent">0</div><div class="att-lbl">未到</div></div>
        </div>
        <button type="button" id="btnToggleRecs" class="rec-toggle" onclick="toggleAttRecords()">展開近期點名明細 ▼</button>
        <div id="attRecList" class="rec-list" style="display:none;"></div>
      </div>

      <!-- 講義領取狀態 -->
      <div class="sec-card">
        <div class="sec-head">
          <h3>講義領取紀錄</h3>
          <span id="bookCountBadge" class="full-pill no">0 / 0</span>
        </div>
        <div id="bookListWrap"></div>
      </div>

      <div class="footer-logout">
        <button type="button" class="btn-logout" onclick="doLogout()">登出 / 切換其他同學帳號</button>
      </div>
    </div>
  </div>

  <!-- 教室座位表彈窗 -->
  <div id="seatModal" class="modal-mask">
    <div class="modal-box">
      <div class="modal-top">
        <h3 id="seatModalTitle">教室座位表</h3>
        <button type="button" class="btn-close" onclick="closeSeatModal()">✕</button>
      </div>
      <div id="seatModalBanner" class="modal-banner info">載入座位圖中...</div>
      <div class="legend">
        <span><i class="leg-dot" style="background:#ffffff;border-color:#94a3b8;"></i>可選空位</span>
        <span><i class="leg-dot" style="background:#cbd5e1;border-color:#94a3b8;"></i>已額滿</span>
        <span><i class="leg-dot" style="background:#16a34a;border-color:#14532d;"></i>我的座位</span>
        <span><i class="leg-dot" style="background:#0284c7;border-color:#0369a1;"></i>目前點選</span>
      </div>
      <div id="stuMapScroll" class="map-scroll">
        <div id="stuClassroomWrap" class="classroom"></div>
      </div>
      <div id="seatConfirmBar" class="confirm-bar">
        <div class="picked-txt" id="pickedSeatLabel">已選擇座位：--</div>
        <button type="button" id="btnConfirmSeat" class="btn-confirm-seat" onclick="submitSeatChoice()">確認鎖定此座位（一人限選一次）</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbz7pnCqepoPJXTRZF0njrVu9Jr-gdqA5pDfEK3W-_ficbpJBQxq1Lfv99Fd7fknyLR0/exec';
    const STORAGE_KEY = 'minhwei_student_cred_v1';

    let currentStudent = null;
    let activeCardType = 'main';
    let serverOffsetMs = 0;
    let countdownTimer = null;
    let recExpanded = false;

    let seatMapData = null;
    let pickedSeatCode = '';

    const LEFT_GRID = [
      [null, null, null, null, 'R',  'A1', 'A2', 'A3', 'A4'],
      [null, null, 'R',  'B2', 'B3', 'B4', 'B5', 'B6', 'B7'],
      ['R',  'R',  'R',  'C4', 'C5', 'C6', 'C7', 'C8', 'C9'],
      ['D1', 'D2', 'D3', 'D4', 'D5', 'D6', 'D7', 'R',  'R' ],
      [null, null, null, null, null, 'E1', 'E2', null, null]
    ];
    const MID_GRID = [
      [null, null,  'A5',  'A6',  'A7',  'A8',  'A9',  'A10', 'A11', 'A12', null,  null ],
      [null, 'B8',  'B9',  'B10', 'B11', 'B12', 'B13', 'B14', 'B15', 'B16', null,  null ],
      ['C10','C11', 'C12', 'C13', 'C14', 'C15', 'C16', 'C17', 'C18', 'C19', 'C20', 'C21'],
      [null, 'D10', 'D11', 'D12', 'D13', 'D14', 'D15', 'D16', 'D17', 'D18', 'D19', null ],
      [null, null,  null,  null,  null,  null,  null,  null,  null,  null,  null,  null ]
    ];
    const RIGHT_GRID = [
      ['A13', 'A14', 'A15', 'R',   'R',   null,  null,  null,  null ],
      ['B17', 'B18', 'B19', 'R',   'R',   'R',   'R',   null,  null ],
      ['C22', 'C23', 'C24', 'C25', 'C26', 'R',   'R',   'R',   'R'  ],
      ['D20', 'D21', 'D22', 'D23', 'D24', 'D25', 'D26', 'D27', 'D28'],
      ['E3',  'E4',  null,  null,  null,  null,  null,  null,  null ]
    ];

    function getCalibratedNowMs() {
      return Date.now() + serverOffsetMs;
    }

    function callGasJsonp(paramsObj) {
      return new Promise((resolve, reject) => {
        const cbName = 'stuCb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
        const script = document.createElement('script');
        let done = false;
        const cleanup = () => {
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
        };
        const timer = setTimeout(() => {
          if (!done) { done = true; cleanup(); reject(new Error('網路連線逾時，請再試一次')); }
        }, 15000);
        window[cbName] = (data) => {
          if (!done) { done = true; clearTimeout(timer); cleanup(); resolve(data); }
        };
        script.onerror = () => {
          if (!done) { done = true; clearTimeout(timer); cleanup(); reject(new Error('無法連線至系統伺服器')); }
        };
        const query = new URLSearchParams(Object.assign({}, paramsObj, { callback: cbName })).toString();
        script.src = GAS_URL + '?' + query;
        document.body.appendChild(script);
      });
    }

    function getAvatarUrl(raw) {
      const fallback = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120"><rect width="100" height="120" fill="#e2e8f0"/><circle cx="50" cy="44" r="20" fill="#94a3b8"/><path d="M18 106c0-20 14-32 32-32s32 12 32 32" fill="#94a3b8"/></svg>');
      if (!raw) return fallback;
      const m = raw.match(/[-\w]{25,}/);
      if (m && (raw.includes('drive.google.com') || raw.includes('googleusercontent.com'))) {
        return 'https://lh3.googleusercontent.com/d/' + m[0] + '=s300';
      }
      return raw;
    }

    async function doLogin(savedCred) {
      const phone = savedCred ? savedCred.phone : document.getElementById('inpPhone').value.trim();
      const idLast4 = savedCred ? savedCred.idLast4 : document.getElementById('inpLast4').value.trim();
      const errEl = document.getElementById('loginErr');
      const btn = document.getElementById('btnLogin');

      errEl.style.display = 'none';
      if (!phone || !idLast4) {
        errEl.style.display = 'block';
        errEl.textContent = '請完整輸入手機號碼與身分證末四碼';
        return;
      }

      btn.disabled = true;
      btn.textContent = '查詢學籍資料中...';

      try {
        const res = await callGasJsonp({ action: 'login', phone: phone, idLast4: idLast4 });
        if (!res || !res.ok || !res.student) {
          if (savedCred) localStorage.removeItem(STORAGE_KEY);
          errEl.style.display = 'block';
          errEl.textContent = (res && res.message) ? res.message : '查無符合的學籍資料';
          return;
        }

        localStorage.setItem(STORAGE_KEY, JSON.stringify({ phone: phone, idLast4: idLast4 }));
        currentStudent = res.student;
        if (currentStudent.seatStatus && currentStudent.seatStatus.serverNowMs) {
          serverOffsetMs = currentStudent.seatStatus.serverNowMs - Date.now();
        }
        renderStudentPass();
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('passView').style.display = 'block';
      } catch (err) {
        errEl.style.display = 'block';
        errEl.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = '開啟我的數位上課證';
      }
    }

    async function refreshStudentData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const btn = document.querySelector('.btn-refresh-top');
      if (btn) { btn.disabled = true; btn.textContent = '更新中...'; }
      try {
        const cred = JSON.parse(raw);
        const res = await callGasJsonp({ action: 'login', phone: cred.phone, idLast4: cred.idLast4 });
        if (res && res.ok && res.student) {
          currentStudent = res.student;
          if (currentStudent.seatStatus && currentStudent.seatStatus.serverNowMs) {
            serverOffsetMs = currentStudent.seatStatus.serverNowMs - Date.now();
          }
          renderStudentPass();
        }
      } catch (e) {
        alert('更新失敗，請檢查網路連線');
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = '↻ 重新整理'; }
      }
    }

    function doLogout() {
      if (countdownTimer) clearInterval(countdownTimer);
      localStorage.removeItem(STORAGE_KEY);
      currentStudent = null;
      document.getElementById('inpPhone').value = '';
      document.getElementById('inpLast4').value = '';
      document.getElementById('passView').style.display = 'none';
      document.getElementById('loginView').style.display = 'block';
    }

    function renderQrCode(textVal) {
      const box = document.getElementById('qrcode');
      box.innerHTML = '';
      new QRCode(box, {
        text: textVal,
        width: 190,
        height: 190,
        colorDark: '#0f172a',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function switchPassCard(type) {
      activeCardType = type;
      document.getElementById('psMain').className = 'ps-btn' + (type === 'main' ? ' active' : '');
      document.getElementById('psErji').className = 'ps-btn' + (type === 'erji' ? ' active' : '');
      if (!currentStudent) return;

      if (type === 'erji' && currentStudent.hasErji) {
        renderQrCode(currentStudent.erjiId);
        document.getElementById('qrIdLabel').textContent = currentStudent.erjiId;
        document.getElementById('qrHintLabel').textContent = currentStudent.erjiLabel + ' 專用條碼';
      } else {
        renderQrCode(currentStudent.mainId);
        document.getElementById('qrIdLabel').textContent = currentStudent.mainId;
        document.getElementById('qrHintLabel').textContent = '進教室點名或領取講義時，請出示此條碼';
      }
    }

    function formatCountdown(msDiff) {
      if (msDiff <= 0) return '00 分 00 秒';
      const totalSec = Math.floor(msDiff / 1000);
      const days = Math.floor(totalSec / 86400);
      const hrs = Math.floor((totalSec % 86400) / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;
      const pad = n => String(n).padStart(2, '0');
      if (days > 0) return days + ' 天 ' + pad(hrs) + ' 時 ' + pad(mins) + ' 分 ' + pad(secs) + ' 秒';
      if (hrs > 0) return pad(hrs) + ' 時 ' + pad(mins) + ' 分 ' + pad(secs) + ' 秒';
      return pad(mins) + ' 分 ' + pad(secs) + ' 秒';
    }

    function renderSeatSection() {
      if (countdownTimer) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }

      const st = currentStudent;
      const ss = st.seatStatus;
      const seatBadge = document.getElementById('stuSeatBadge');
      const btnTextEnded = document.getElementById('btnSeatTextEnded');
      const endedNoSeatNote = document.getElementById('seatEndedNoSeatNote');
      const actionArea = document.getElementById('seatActionArea');

      // 先重置所有狀態
      seatBadge.style.display = 'none';
      btnTextEnded.style.display = 'none';
      endedNoSeatNote.style.display = 'none';
      actionArea.style.display = 'none';
      actionArea.innerHTML = '';

      if (!ss || !ss.hasGroup) return;

      const mySeat = ss.mySeat || st.seat || '';
      const mode = ss.seatMode || 'paused';

      // 若已有座號，姓名旁一律顯示座號小標籤
      if (mySeat) {
        seatBadge.style.display = 'inline-block';
        seatBadge.textContent = '座位 ' + mySeat;
      }

      // === 階段三：已結束劃位（手動切換後） ===
      if (mode === 'ended') {
        if (mySeat) {
          // 收起大按鈕，僅保留姓名旁精巧的「查看座位圖」文字按鈕
          btnTextEnded.style.display = 'inline-block';
        } else {
          // 逾期未劃位提示
          endedNoSeatNote.style.display = 'block';
        }
        return;
      }

      // === 階段一：暫停劃位（開放前防呆） ===
      if (mode === 'paused') {
        actionArea.style.display = 'block';
        if (mySeat) {
          actionArea.innerHTML =
            '<button type="button" class="btn-seat-locked" onclick="openSeatModal()">我的座位：' + mySeat + '（點擊查看座位圖）</button>';
        } else {
          actionArea.innerHTML =
            '<div class="paused-card">' +
              '<div>⏸ 線上劃位尚未開放，請留意班級群組公告</div>' +
              '<button type="button" class="btn-preview-map" style="margin-top:8px;" onclick="openSeatModal()">先預覽教室座位配置（唯讀）</button>' +
            '</div>';
        }
        return;
      }

      // === 階段二：依梯次時間開放（open） ===
      actionArea.style.display = 'block';
      if (mySeat) {
        actionArea.innerHTML =
          '<button type="button" class="btn-seat-locked" onclick="openSeatModal()">我的座位：' + mySeat + '（點擊查看座位圖）</button>';
        return;
      }

      const updateOpenOrCountdownUI = () => {
        const nowMs = getCalibratedNowMs();
        const unlockMs = ss.unlockTimeMs || 0;
        const isUnlocked = (nowMs >= unlockMs);

        if (isUnlocked) {
          if (countdownTimer) {
            clearInterval(countdownTimer);
            countdownTimer = null;
          }
          ss.canSelect = true;
          const rankTxt = ss.rank ? ('校內' + ss.seatGroup + '班 第 ' + ss.rank + ' 順位') : ('校內' + ss.seatGroup + '班');
          actionArea.innerHTML =
            '<button type="button" class="btn-seat-open" onclick="openSeatModal()">🪑 開放劃位中！點我選擇座位（' + rankTxt + '）</button>';
        } else {
          const remain = unlockMs - nowMs;
          const rankHeader = ss.rank
            ? ('🔒 校內' + ss.seatGroup + '班 第 ' + ss.rank + ' 順位（第 ' + ss.batchNum + ' 梯）')
            : ('🔒 校內' + ss.seatGroup + '班 線上劃位排隊中');
          actionArea.innerHTML =
            '<div class="wait-card">' +
              '<div class="wait-rank">' + rankHeader + '</div>' +
              '<div class="wait-time">您的開放時間：<b>' + (ss.unlockTimeStr || '--') + '</b>（過號不影響後續梯次）</div>' +
              '<div class="wait-countdown">距離開放倒數：' + formatCountdown(remain) + '</div>' +
              '<button type="button" class="btn-preview-map" onclick="openSeatModal()">👀 先查看即時空位戰況（唯讀）</button>' +
            '</div>';
        }
      };

      updateOpenOrCountdownUI();
      if (getCalibratedNowMs() < (ss.unlockTimeMs || 0)) {
        countdownTimer = setInterval(updateOpenOrCountdownUI, 1000);
      }
    }

    function renderStudentPass() {
      const st = currentStudent;
      if (!st) return;

      document.getElementById('stuAvatar').src = getAvatarUrl(st.avatar);
      document.getElementById('stuName').textContent = st.name;
      document.getElementById('stuMeta').innerHTML =
        '學號：<b>' + st.mainId + '</b><br>' +
        '班別：' + (st.mainClass || '--') + (st.className ? (' ｜ ' + st.className) : '');

      if (st.hasErji) {
        document.getElementById('erjiSwitchBar').style.display = 'grid';
      } else {
        document.getElementById('erjiSwitchBar').style.display = 'none';
        activeCardType = 'main';
      }
      switchPassCard(activeCardType);
      renderSeatSection();

      // 出缺勤卡片
      const attCard = document.getElementById('attCard');
      if (st.attendanceSummary) {
        attCard.style.display = 'block';
        const c = st.attendanceSummary.counts || {};
        document.getElementById('cntPresent').textContent = c['出席'] || 0;
        document.getElementById('cntLate').textContent = c['遲到'] || 0;
        document.getElementById('cntEarly').textContent = c['早退'] || 0;
        document.getElementById('cntLeave').textContent = c['請假'] || 0;
        document.getElementById('cntAbsent').textContent = c['未到'] || 0;

        const badge = document.getElementById('fullAttBadge');
        if (st.attendanceSummary.totalSessions === 0) {
          badge.className = 'full-pill no';
          badge.textContent = '尚未開課';
        } else if (st.attendanceSummary.isFullAttendance) {
          badge.className = 'full-pill yes';
          badge.textContent = '✔ 目前全勤（共 ' + st.attendanceSummary.totalSessions + ' 堂）';
        } else {
          badge.className = 'full-pill no';
          badge.textContent = '未全勤（共 ' + st.attendanceSummary.totalSessions + ' 堂）';
        }

        const recs = st.attendanceSummary.records || [];
        const recWrap = document.getElementById('attRecList');
        if (recs.length === 0) {
          recWrap.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:10px;">尚無點名紀錄</div>';
        } else {
          recWrap.innerHTML = recs.map(r =>
            '<div class="rec-row">' +
              '<span>' + r.date + ' ' + r.session + '</span>' +
              '<b>' + r.status + '</b>' +
            '</div>'
          ).join('');
        }
      } else {
        attCard.style.display = 'none';
      }

      // 講義領取清單
      const books = st.books || [];
      const gotCnt = books.filter(b => b.received).length;
      document.getElementById('bookCountBadge').textContent = '已領 ' + gotCnt + ' / ' + books.length + ' 本';
      const bookWrap = document.getElementById('bookListWrap');
      if (books.length === 0) {
        bookWrap.innerHTML = '<div style="text-align:center;color:#94a3b8;font-size:13px;padding:10px;">尚無書單資料</div>';
      } else {
        bookWrap.innerHTML = books.map(b =>
          '<div class="book-item">' +
            '<span>' + b.name + ' <small style="color:#94a3b8;">(' + b.code + ')</small></span>' +
            '<span class="b-badge ' + (b.received ? 'got' : 'wait') + '">' + (b.received ? '已領取' : '尚未領取') + '</span>' +
          '</div>'
        ).join('');
      }
    }

    function toggleAttRecords() {
      recExpanded = !recExpanded;
      document.getElementById('attRecList').style.display = recExpanded ? 'block' : 'none';
      document.getElementById('btnToggleRecs').textContent = recExpanded ? '收合點名明細 ▲' : '展開近期點名明細 ▼';
    }

    // ==========================================
    // === 教室座位圖檢視與選位互動 ===
    // ==========================================

    async function openSeatModal() {
      if (!currentStudent) return;
      pickedSeatCode = '';
      document.getElementById('seatConfirmBar').style.display = 'none';
      document.getElementById('seatModalBanner').className = 'modal-banner info';
      document.getElementById('seatModalBanner').textContent = '正在載入最新教室座位表...';
      document.getElementById('stuClassroomWrap').innerHTML = '';
      document.getElementById('seatModal').style.display = 'flex';

      try {
        const res = await callGasJsonp({ action: 'getSeatMap', studentId: currentStudent.mainId });
        if (!res || !res.ok) {
          document.getElementById('seatModalBanner').className = 'modal-banner warn';
          document.getElementById('seatModalBanner').textContent = (res && res.message) || '載入座位表失敗';
          return;
        }

        seatMapData = res;
        if (res.seatStatus) {
          currentStudent.seatStatus = res.seatStatus;
          if (res.seatStatus.serverNowMs) {
            serverOffsetMs = res.seatStatus.serverNowMs - Date.now();
          }
          renderSeatSection();
        }
        renderSeatMapModal();
      } catch (err) {
        document.getElementById('seatModalBanner').className = 'modal-banner warn';
        document.getElementById('seatModalBanner').textContent = err.message;
      }
    }

    function closeSeatModal() {
      document.getElementById('seatModal').style.display = 'none';
      pickedSeatCode = '';
    }

    function canStudentPickNow() {
      if (!seatMapData || !seatMapData.seatStatus) return false;
      const ss = seatMapData.seatStatus;
      if (ss.seatMode !== 'open') return false;
      if (seatMapData.mySeat || ss.locked) return false;
      return getCalibratedNowMs() >= (ss.unlockTimeMs || 0);
    }

    function renderSeatMapModal() {
      const ss = seatMapData.seatStatus || {};
      const grp = seatMapData.seatGroup || '';
      const mySeat = seatMapData.mySeat || '';
      const interactive = canStudentPickNow();

      document.getElementById('seatModalTitle').textContent = '敏惠校內 ' + grp + ' 班｜教室座位圖';
      const banner = document.getElementById('seatModalBanner');

      if (mySeat) {
        banner.className = 'modal-banner ok';
        banner.textContent = '您已鎖定座位【' + mySeat + '】（綠色標示為您的位置，如需換位請洽行政老師）';
      } else if (ss.seatMode === 'paused') {
        banner.className = 'modal-banner warn';
        banner.textContent = '目前為「暫停劃位」預覽模式，正式開放後方可點選座位';
      } else if (ss.seatMode === 'ended') {
        banner.className = 'modal-banner warn';
        banner.textContent = '線上劃位已截止，如需安排座位請洽行政老師';
      } else if (!interactive) {
        banner.className = 'modal-banner warn';
        banner.textContent = '唯讀看盤模式｜您的順位（第 ' + ss.rank + ' 順位）將於 ' + ss.unlockTimeStr + ' 開放選位';
      } else {
        banner.className = 'modal-banner info';
        banner.textContent = '請點選下方白色空位，選好後按「確認鎖定此座位」（每人限選一次）';
      }

      document.getElementById('stuClassroomWrap').innerHTML =
        '<div class="wb">白  板（校內 ' + grp + ' 班）</div>' +
        '<div class="zones">' +
          buildStudentZoneHtml(LEFT_GRID, 9, true, false, interactive) +
          buildStudentZoneHtml(MID_GRID, 12, false, false, interactive) +
          buildStudentZoneHtml(RIGHT_GRID, 9, false, true, interactive) +
        '</div>' +
        '<div class="doors"><span>教室門口</span><span>教室門口</span></div>';
    }

    function buildStudentZoneHtml(gridData, colCount, showLeftRowNum, showRightRowNum, interactive) {
      const takenSeats = (seatMapData && seatMapData.takenSeats) || {};
      let html = '<div class="zone"><div class="sgrid" style="grid-template-columns:' +
        (showLeftRowNum ? '18px ' : '') + 'repeat(' + colCount + ', 36px)' + (showRightRowNum ? ' 18px' : '') + ';">';

      if (showLeftRowNum) html += '<div class="scell head"></div>';
      for (let c = 1; c <= colCount; c++) {
        html += '<div class="scell head">' + c + '</div>';
      }
      if (showRightRowNum) html += '<div class="scell head"></div>';

      for (let r = 0; r < 5; r++) {
        if (showLeftRowNum) html += '<div class="scell head">' + (r + 1) + '</div>';
        for (let c = 0; c < colCount; c++) {
          const code = gridData[r][c];
          if (!code) {
            html += '<div class="scell aisle"></div>';
          } else if (code === 'R') {
            html += '<div class="scell res">保留</div>';
          } else {
            const state = takenSeats[code];
            if (state === 'MINE') {
              html += '<div class="scell mine">' + code + '</div>';
            } else if (state === 'TAKEN') {
              html += '<div class="scell taken">' + code + '</div>';
            } else {
              const isPicked = (pickedSeatCode === code);
              const cls = 'scell free' + (interactive ? '' : ' readonly') + (isPicked ? ' picked' : '');
              const clickAttr = interactive ? (' onclick="pickSeatCell(\'' + code + '\')"') : '';
              html += '<div class="' + cls + '"' + clickAttr + '>' + code + '</div>';
            }
          }
        }
        if (showRightRowNum) html += '<div class="scell head">' + (r + 1) + '</div>';
      }
      html += '</div></div>';
      return html;
    }

    function pickSeatCell(seatCode) {
      if (!canStudentPickNow()) return;
      pickedSeatCode = seatCode;
      renderSeatMapModal();
      document.getElementById('pickedSeatLabel').textContent = '目前點選座位：【' + seatCode + '】';
      document.getElementById('seatConfirmBar').style.display = 'block';
    }

    async function submitSeatChoice() {
      if (!currentStudent || !pickedSeatCode) return;
      if (!confirm('確定要鎖定座位【' + pickedSeatCode + '】嗎？\n送出後即永久鎖定，無法自行更改喔！')) return;

      const btn = document.getElementById('btnConfirmSeat');
      btn.disabled = true;
      btn.textContent = '正在鎖定座位...';

      try {
        const res = await callGasJsonp({
          action: 'selectSeat',
          studentId: currentStudent.mainId,
          seat: pickedSeatCode
        });
        if (!res || !res.ok) {
          alert((res && res.message) || '劃位失敗，請重新選擇');
          await openSeatModal();
          return;
        }

        alert(res.message);
        closeSeatModal();
        await refreshStudentData();
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '確認鎖定此座位（一人限選一次）';
      }
    }

    window.onload = function() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          const cred = JSON.parse(raw);
          if (cred && cred.phone && cred.idLast4) {
            doLogin(cred);
          }
        } catch (e) {}
      }
    };
  </script>
