<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>敏惠校內班｜數位上課證</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
    body { margin: 0; background: #f0f4f8; color: #1e293b; padding: 16px; }
    .container { max-width: 440px; margin: 0 auto; }
    .card { background: #fff; border-radius: 20px; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08); overflow: hidden; margin-bottom: 16px; }
    .header-bar { background: linear-gradient(135deg, #0284c7, #0369a1); color: #fff; padding: 16px 20px; text-align: center; transition: 0.25s; }
    .header-bar.erji-theme { background: linear-gradient(135deg, #7c3aed, #5b21b6); }
    .header-bar h1 { margin: 0; font-size: 18px; letter-spacing: 1px; }
    .clock-bar { background: rgba(255,255,255,0.18); display: inline-block; padding: 4px 12px; border-radius: 99px; font-size: 13px; margin-top: 6px; font-variant-numeric: tabular-nums; font-weight: 600; }
    .tab-switch { display: flex; background: #e2e8f0; border-radius: 12px; padding: 4px; margin: 14px 16px 0; }
    .tab-btn { flex: 1; border: none; background: transparent; padding: 10px; border-radius: 9px; font-size: 14px; font-weight: 700; color: #475569; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: #fff; color: #0284c7; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .tab-btn.active.erji { color: #7c3aed; }
    .erji-badge { background: #f3e8ff; color: #6b21a8; border: 1px solid #d8b4fe; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 99px; display: inline-block; margin-top: 10px; }
    .profile-box { display: flex; align-items: center; padding: 20px; gap: 16px; border-bottom: 1px dashed #e2e8f0; }
    .avatar { width: 84px; height: 84px; border-radius: 14px; object-fit: cover; border: 2px solid #e2e8f0; background: #f8fafc; flex-shrink: 0; }
    .info h2 { margin: 0 0 4px; font-size: 21px; color: #0f172a; }
    .info p { margin: 3px 0; font-size: 13px; color: #475569; }
    .id-tag { display: inline-block; background: #e0f2fe; color: #0369a1; font-weight: 800; font-size: 15px; padding: 3px 10px; border-radius: 6px; margin-top: 4px; letter-spacing: 0.5px; }
    .id-tag.erji { background: #f3e8ff; color: #6b21a8; }
    .qr-section { text-align: center; padding: 20px; }
    #qrcode { display: inline-block; padding: 12px; background: #fff; border: 2px solid #f1f5f9; border-radius: 14px; }
    .qr-hint { font-size: 12px; color: #64748b; margin-top: 8px; }
    .book-section { padding: 18px 20px; }
    .book-title { font-size: 16px; font-weight: 700; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
    .book-count { font-size: 12px; background: #f1f5f9; color: #475569; padding: 3px 10px; border-radius: 99px; }
    .book-item { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid #f1f5f9; }
    .book-item:last-child { border-bottom: none; }
    .book-name { font-size: 14px; font-weight: 600; color: #1e293b; }
    .book-code { font-size: 11px; color: #94a3b8; display: block; margin-top: 2px; }
    .status-pill { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; flex-shrink: 0; }
    .status-yes { background: #dcfce7; color: #15803d; }
    .status-no { background: #f1f5f9; color: #64748b; }
    .bind-box { padding: 24px 20px; }
    .bind-title { font-size: 18px; font-weight: 800; color: #0f172a; margin: 0 0 6px; }
    .bind-sub { font-size: 13px; color: #64748b; margin: 0 0 20px; line-height: 1.5; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 12px; font-size: 16px; outline: none; transition: 0.2s; }
    .form-group input:focus { border-color: #0284c7; }
    .btn-primary { width: 100%; background: #0284c7; color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; }
    .btn-primary:disabled { background: #94a3b8; }
    .err-msg { color: #dc2626; font-size: 13px; font-weight: 600; text-align: center; margin-top: 12px; }
    .center-msg { text-align: center; padding: 48px 20px; font-weight: 700; color: #475569; }
    .logout-wrap { text-align: center; padding: 4px 0 20px; }
    .btn-logout { background: transparent; border: none; color: #64748b; font-size: 13px; text-decoration: underline; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <div id="loadingView" class="card center-msg" style="display:none;">正在載入數位上課證...</div>

    <div id="bindView" class="card">
      <div class="header-bar">
        <h1>敏惠校內班｜數位上課證</h1>
      </div>
      <div class="bind-box">
        <p class="bind-title">學籍登入驗證</p>
        <p class="bind-sub">請輸入報名時登記的手機號碼與身分證末四碼，開啟專屬數位上課證。</p>
        <div class="form-group">
          <label>手機號碼</label>
          <input type="tel" id="bindPhone" placeholder="例如：0912345678" maxlength="10">
        </div>
        <div class="form-group">
          <label>身分證末四碼</label>
          <input type="text" id="bindIdLast4" placeholder="例如：1234" maxlength="4">
        </div>
        <button id="bindBtn" class="btn-primary" onclick="submitLogin()">開啟數位上課證</button>
        <div id="bindError" class="err-msg"></div>
      </div>
    </div>

    <div id="passView" style="display:none;">
      <div class="card">
        <div id="headerBar" class="header-bar">
          <h1 id="headerTitle">敏惠校內班｜數位上課證</h1>
          <div id="liveClock" class="clock-bar">--/--/-- --:--:--</div>
        </div>

        <div id="tabSwitch" class="tab-switch" style="display:none;">
          <button id="tabMain" class="tab-btn active" onclick="switchMode('main')">敏惠校內班</button>
          <button id="tabErji" class="tab-btn" onclick="switchMode('erji')">二技衝刺班</button>
        </div>

        <div class="profile-box">
          <img id="stuAvatar" class="avatar" src="" alt="大頭照">
          <div class="info">
            <h2 id="stuName">--</h2>
            <div id="stuIdTag" class="id-tag">--</div>
            <p id="stuMeta">--</p>
            <div id="erjiBadge" class="erji-badge" style="display:none;"></div>
          </div>
        </div>

        <div class="qr-section">
          <div id="qrcode"></div>
          <div class="qr-hint">點名報到或領取講義時，請向工作人員出示此條碼</div>
        </div>
      </div>

      <div id="bookCard" class="card book-section">
        <div class="book-title">
          <span>講義領取紀錄</span>
          <span id="bookCount" class="book-count">0 / 0</span>
        </div>
        <div id="bookList"></div>
      </div>

      <div class="logout-wrap">
        <button class="btn-logout" onclick="logoutStudent()">切換學生 / 重新登入</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzpkipAHDbRdqF7jXBr9jx-zvNjaTO6m9QJgHjSqwdTVYZmr0kIncx05U2VFc5p-ndPdA/exec';
    const STORAGE_KEY = 'minhwei_pass_saved_user';

    let studentData = null;
    let currentMode = 'main';

    function startClock() {
      const el = document.getElementById('liveClock');
      const update = () => {
        const now = new Date();
        el.textContent = now.toLocaleDateString('zh-TW') + ' ' + now.toTimeString().split(' ')[0];
      };
      update();
      setInterval(update, 1000);
    }

    function callGasJsonp(paramsObj) {
      return new Promise((resolve, reject) => {
        const cbName = 'gasCb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
        const script = document.createElement('script');
        let isDone = false;

        const cleanup = () => {
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
        };

        const timer = setTimeout(() => {
          if (!isDone) {
            isDone = true;
            cleanup();
            reject(new Error('連線逾時，請確認網路狀態後再試一次'));
          }
        }, 15000);

        window[cbName] = (data) => {
          if (!isDone) {
            isDone = true;
            clearTimeout(timer);
            cleanup();
            resolve(data);
          }
        };

        script.onerror = () => {
          if (!isDone) {
            isDone = true;
            clearTimeout(timer);
            cleanup();
            reject(new Error('無法連線至資料庫，請確認後台是否已發布最新版本'));
          }
        };

        const query = new URLSearchParams(Object.assign({}, paramsObj, { callback: cbName })).toString();
        script.src = GAS_URL + '?' + query;
        document.body.appendChild(script);
      });
    }

    async function performLogin(phone, idLast4, isAuto) {
      const errEl = document.getElementById('bindError');
      const btn = document.getElementById('bindBtn');

      if (isAuto) {
        document.getElementById('bindView').style.display = 'none';
        document.getElementById('loadingView').style.display = 'block';
      } else {
        errEl.textContent = '';
        btn.disabled = true;
        btn.textContent = '查詢學籍中...';
      }

      try {
        const res = await callGasJsonp({ action: 'login', phone: phone, idLast4: idLast4 });
        document.getElementById('loadingView').style.display = 'none';

        if (res && res.found && res.student) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ phone: phone, idLast4: idLast4 }));
          studentData = res.student;
          document.getElementById('bindView').style.display = 'none';
          document.getElementById('passView').style.display = 'block';
          renderPass();
        } else {
          localStorage.removeItem(STORAGE_KEY);
          document.getElementById('passView').style.display = 'none';
          document.getElementById('bindView').style.display = 'block';
          if (!isAuto) {
            errEl.textContent = (res && res.message) ? res.message : '查無符合的學籍資料，請確認輸入是否正確';
          }
        }
      } catch (err) {
        document.getElementById('loadingView').style.display = 'none';
        document.getElementById('bindView').style.display = 'block';
        errEl.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = '開啟數位上課證';
      }
    }

    function submitLogin() {
      const phone = document.getElementById('bindPhone').value.trim();
      const idLast4 = document.getElementById('bindIdLast4').value.trim().toUpperCase();
      const errEl = document.getElementById('bindError');

      if (!phone || !idLast4) {
        errEl.textContent = '請完整輸入手機號碼與身分證末四碼';
        return;
      }
      performLogin(phone, idLast4, false);
    }

    function logoutStudent() {
      localStorage.removeItem(STORAGE_KEY);
      studentData = null;
      document.getElementById('bindPhone').value = '';
      document.getElementById('bindIdLast4').value = '';
      document.getElementById('bindError').textContent = '';
      document.getElementById('passView').style.display = 'none';
      document.getElementById('bindView').style.display = 'block';
    }

    function switchMode(mode) {
      currentMode = mode;
      renderPass();
    }

    function renderPass() {
      if (!studentData) return;
      const isErji = (currentMode === 'erji' && studentData.hasErji);

      document.getElementById('tabSwitch').style.display = studentData.hasErji ? 'flex' : 'none';
      document.getElementById('tabMain').className = 'tab-btn' + (!isErji ? ' active' : '');
      document.getElementById('tabErji').className = 'tab-btn' + (isErji ? ' active erji' : '');

      const headerBar = document.getElementById('headerBar');
      const headerTitle = document.getElementById('headerTitle');
      const idTag = document.getElementById('stuIdTag');
      const erjiBadge = document.getElementById('erjiBadge');

      if (isErji) {
        headerBar.classList.add('erji-theme');
        headerTitle.textContent = '二技衝刺班｜數位上課證';
        idTag.classList.add('erji');
        erjiBadge.style.display = 'inline-block';
        erjiBadge.textContent = studentData.erjiLabel || studentData.erjiType || '二技班別認證';
      } else {
        headerBar.classList.remove('erji-theme');
        headerTitle.textContent = '敏惠校內班｜數位上課證';
        idTag.classList.remove('erji');
        erjiBadge.style.display = 'none';
      }

      const fallbackAvatar = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#e2e8f0"/><circle cx="50" cy="38" r="18" fill="#94a3b8"/><path d="M20 88c0-17 13-28 30-28s30 11 30 28" fill="#94a3b8"/></svg>');
      document.getElementById('stuAvatar').src = studentData.avatar || studentData.pictureUrl || fallbackAvatar;
      document.getElementById('stuName').textContent = studentData.name || '同學';

      const activeId = isErji ? (studentData.erjiId || studentData.studentId) : (studentData.studentId || '');
      idTag.textContent = activeId || '--';

      const metaParts = [studentData.school, studentData.dept, studentData.className].filter(Boolean);
      document.getElementById('stuMeta').textContent = metaParts.join(' · ') || '敏惠醫護管理專科學校';

      const qrEl = document.getElementById('qrcode');
      qrEl.innerHTML = '';
      if (activeId) {
        new QRCode(qrEl, { text: String(activeId), width: 170, height: 170 });
      }

      const books = Array.isArray(studentData.books) ? studentData.books : [];
      const bookListEl = document.getElementById('bookList');
      const receivedCount = books.filter(b => b.received || b.claimed || b.isReceived).length;
      document.getElementById('bookCount').textContent = '已領 ' + receivedCount + ' / ' + books.length + ' 本';

      if (books.length === 0) {
        bookListEl.innerHTML = '<div style="text-align:center;color:#94a3b8;font-size:13px;padding:12px 0;">目前尚無書單資料</div>';
      } else {
        bookListEl.innerHTML = books.map(b => {
          const isGot = Boolean(b.received || b.claimed || b.isReceived);
          const bName = b.name || b.title || b.code || '講義';
          const bCode = b.code || b.id || '';
          return '<div class="book-item">' +
            '<div><span class="book-name">' + bName + '</span>' + (bCode ? '<span class="book-code">' + bCode + '</span>' : '') + '</div>' +
            '<span class="status-pill ' + (isGot ? 'status-yes' : 'status-no') + '">' + (isGot ? '已領取' : '未領取') + '</span>' +
          '</div>';
        }).join('');
      }
    }

    window.onload = function() {
      startClock();
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (saved && saved.phone && saved.idLast4) {
          performLogin(saved.phone, saved.idLast4, true);
        }
      } catch (e) {
        localStorage.removeItem(STORAGE_KEY);
      }
    };
  </script>
</body>
</html>
